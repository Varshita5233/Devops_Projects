{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-order-service
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-order-service
                port:
                  number: {{ .Values.service.port }}
{{- end }}
