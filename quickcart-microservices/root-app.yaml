apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quickcart-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Varshita5233/Devops_Projects.git
    targetRevision: main
    # Points at the folder containing the child Application manifests.
    # ArgoCD applies every Application YAML it finds here.
    path: quickcart-microservices/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
