server:
  port: 8081

spring:
  application:
    name: product-service
  security:
    oauth2:
          resourceserver:
            jwt:
              issuer-uri: ${AUTH_SERVER_ISSUER:http://localhost:9000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}

