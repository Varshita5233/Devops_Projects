# PROD overrides - more replicas, autoscaling enabled, more resources
replicaCount: 3

appVersion: "v1-prod"

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
